imu_node:
  ros__parameters:
    spi_device: "/dev/spidev0.0"
    publish_rate_freq: 100
    frame_id: "imu_link"
    covariance_file: ""  # Path to covariance calibration file. Empty uses the ROS default location.
    tilt_calibration_file: ""  # Path to tilt calibration file. Empty uses the ROS default location.
